name: miaotou_capabilities_android
description: >-
  The Android answer to every member of the capability contract.
publish_to: "none"

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  miaotou_capabilities:
    path: ../miaotou_capabilities
  miaotou_capabilities_shared:
    path: ../miaotou_capabilities_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        package: com.miaotoujunshi.capabilities.android
        pluginClass: MiaotouAndroidPlugin
