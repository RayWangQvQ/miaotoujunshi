name: Platform preview packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional preview release tag, for example v0.1.0-preview"
        required: false
        type: string
  push:
    paths:
      - "integrations/jev_android/**"
      - "integrations/jev_windows/**"
      - "integrations/jev_mac/**"
      - "references/**"
      - "examples/**"
      - "goutoujunshi/**"
      - "scripts/package_mac.py"
      - "PRIVACY.md"
      - "tests/test_platform_integrations.py"
      - ".github/workflows/platform-build.yml"
  pull_request:
    paths:
      - "integrations/jev_android/**"
      - "integrations/jev_windows/**"
      - "integrations/jev_mac/**"
      - "references/**"
      - "examples/**"
      - "goutoujunshi/**"
      - "scripts/package_mac.py"
      - "PRIVACY.md"
      - "tests/test_platform_integrations.py"
      - ".github/workflows/platform-build.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/jev_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: miaotoujunshi-android-debug
          path: integrations/jev_android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: integrations/jev_windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m compileall -q app core main.py
      - run: python -m core.draft
      - run: python -c "import app.overlay, app.review, app.trend_ui, app.cloud_ocr, core.experience"
      - run: python check_ui.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm --clean jev.spec
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Copy-Item README.md dist/miaotoujunshi-windows/README.md
          Copy-Item LICENSE dist/miaotoujunshi-windows/LICENSE
          Copy-Item NOTICE dist/miaotoujunshi-windows/NOTICE
          Compress-Archive -Path dist/miaotoujunshi-windows -DestinationPath dist/miaotoujunshi-windows-preview.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: miaotoujunshi-windows-preview
          path: integrations/jev_windows/dist/miaotoujunshi-windows-preview.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B scripts/validate_layout.py
      - run: python -B goutoujunshi/scripts/validate_skill.py --runtime
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/package_mac.py
      - uses: actions/upload-artifact@v4
        with:
          name: miaotoujunshi-mac-source
          path: dist/miaotoujunshi-mac.zip

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: [android, windows, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Verify and name release files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]
          mkdir -p publish
          cp release-assets/miaotoujunshi-mac-source/miaotoujunshi-mac.zip publish/
          cp release-assets/miaotoujunshi-android-debug/app-debug.apk publish/miaotoujunshi-android-debug.apk
          cp release-assets/miaotoujunshi-windows-preview/miaotoujunshi-windows-preview.zip publish/
          test -s publish/miaotoujunshi-mac.zip
          test -s publish/miaotoujunshi-android-debug.apk
          test -s publish/miaotoujunshi-windows-preview.zip
          (cd publish && sha256sum *.zip *.apk > SHA256SUMS.txt)
      - name: Publish preview release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Mac、Windows 与 Android 预览包 / Preview packages

          - **macOS:** `miaotoujunshi-mac.zip` — source package. Install Python 3.12 and uv, then run `安装依赖.command` and `启动.command`. This is not a signed `.app`.
          - **Windows:** `miaotoujunshi-windows-preview.zip` — extract the complete directory before launching the executable. Automated build passes; physical-device validation is pending.
          - **Android:** `miaotoujunshi-android-debug.apk` — Android 11+ debug preview. An older debug APK may have a different signing certificate; uninstall it first if Android rejects the update (this clears local app data). **WeChat is currently unsupported because this Android build cannot capture WeChat chat screenshots.** Other chat-app paths still need device-level validation.

          Transcript review, Jev/DeepSeek strategy selection, ranked drafts, detailed analysis, style rewrite, relationship stage/goal, and example/CSV K-line views are included across the three platforms. UI layouts and capture support differ; the screenshots in the README show Mac. Check `SHA256SUMS.txt` after downloading. See the README and PRIVACY.md for setup, feature scope, and data use.

          Windows packages include PySide6-Fluent-Widgets; see `integrations/jev_windows/NOTICE` for redistribution terms.
          EOF
          gh release create "$RELEASE_TAG" publish/* --target "$GITHUB_SHA" --latest --title "喵头军师 $RELEASE_TAG" --notes-file release-notes.md
