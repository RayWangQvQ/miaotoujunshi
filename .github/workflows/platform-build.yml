name: Platform preview packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional preview release tag, for example v0.1.0-preview"
        required: false
        type: string
  push:
    paths:
      - "integrations/jev_flutter/**"
      - "miaotoujunshi/**"
      - "goutoujunshi/**"
      - "PRIVACY.md"
      - "tests/test_android_release.py"
      - "tests/test_macos_release.py"
      - "tests/test_windows_release.py"
      - ".github/workflows/platform-build.yml"
  pull_request:
    paths:
      - "integrations/jev_flutter/**"
      - "miaotoujunshi/**"
      - "goutoujunshi/**"
      - "PRIVACY.md"
      - "tests/test_android_release.py"
      - "tests/test_macos_release.py"
      - "tests/test_windows_release.py"
      - ".github/workflows/platform-build.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/jev_flutter/apps/miaotou_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: miaotoujunshi-android-debug
          path: integrations/jev_flutter/apps/miaotou_app/build/app/outputs/flutter-apk/app-debug.apk

  flutter-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: integrations/jev_flutter/apps/miaotou_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          Copy-Item "../../../../README.md" "$release/README.md"
          Copy-Item "../../../../LICENSE" "$release/LICENSE"
          Copy-Item "../../../../NOTICE" "$release/NOTICE"
          Compress-Archive -Path "$release/*" -DestinationPath "build/miaotoujunshi-windows-preview.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: miaotoujunshi-windows-preview
          path: integrations/jev_flutter/apps/miaotou_app/build/miaotoujunshi-windows-preview.zip

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/jev_flutter/apps/miaotou_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      # Sign and notarize only when release credentials are configured. Without
      # them the app keeps Flutter's default ad-hoc signature: it builds, runs
      # locally, and the artifact is still uploaded, but Gatekeeper will block it
      # on other machines. We skip (not fail) in that case so the job stays green.
      # When credentials ARE present they must be valid — a broken signing run
      # still fails the job on purpose.
      - name: Sign and notarize macOS application
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for required in \
            MACOS_CERTIFICATE \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            test -n "${!required}" || missing+=("$required")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::macOS release credentials missing (${missing[*]}); skipping Developer ID signing and notarization. The .app keeps its ad-hoc signature."
            exit 0
          fi

          app="build/macos/Build/Products/Release/miaotou_app.app"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/miaotou-signing.keychain-db"
          submission="$RUNNER_TEMP/miaotoujunshi-notarization.zip"
          keychain_password="$(uuidgen)"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          ditto -c -k --sequesterRsrc --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
      - name: Create macOS application ZIP
        run: |
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/miaotou_app.app \
            build/release/miaotoujunshi-mac.zip
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: miaotoujunshi-mac
          path: integrations/jev_flutter/apps/miaotou_app/build/release/miaotoujunshi-mac.zip

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: [android, flutter-windows, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Verify and name release files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]
          mkdir -p publish
          cp release-assets/miaotoujunshi-mac/miaotoujunshi-mac.zip publish/
          cp release-assets/miaotoujunshi-android-debug/app-debug.apk publish/miaotoujunshi-android-debug.apk
          cp release-assets/miaotoujunshi-windows-preview/miaotoujunshi-windows-preview.zip publish/
          test -s publish/miaotoujunshi-mac.zip
          test -s publish/miaotoujunshi-android-debug.apk
          test -s publish/miaotoujunshi-windows-preview.zip
          (cd publish && sha256sum *.zip *.apk > SHA256SUMS.txt)
      - name: Publish preview release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Mac、Windows 与 Android 预览包 / Preview packages

          - **macOS:** `miaotoujunshi-mac.zip` — the accepted Flutter `.app`, signed with Developer ID and notarised by Apple. Extract it before launching.
          - **Windows:** `miaotoujunshi-windows-preview.zip` — the accepted Flutter application. Extract the complete directory before launching the executable.
          - **Android:** `miaotoujunshi-android-debug.apk` — the accepted Flutter Android 11+ debug preview. An older debug APK may have a different signing certificate; uninstall it first if Android rejects the update (this clears local app data). Supported capture adapters are QQ, Feishu and X; WeChat and Douyin are not supported. Candidate generation, editing and copy were accepted on a physical Android 15 device. Verified one-tap fill is tracked separately.

          Transcript review, Jev/DeepSeek strategy selection, ranked drafts, detailed analysis, style rewrite, relationship stage/goal, and example/CSV K-line views are included across the three platforms. UI layouts and capture support differ; the screenshots in the README show Mac. Check `SHA256SUMS.txt` after downloading. See the README and PRIVACY.md for setup, feature scope, and data use.
          EOF
          gh release create "$RELEASE_TAG" publish/* --target "$GITHUB_SHA" --latest --title "喵头军师 $RELEASE_TAG" --notes-file release-notes.md
