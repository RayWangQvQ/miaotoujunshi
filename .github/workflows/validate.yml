name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository layout
        run: python3 -B scripts/validate_layout.py
      - name: Validate skill payload
        run: python3 -B goutoujunshi/scripts/validate_skill.py --runtime
      - name: Test remaining Python integrations
        run: python3 -B -m unittest discover -s tests -v
